# Compose de produccion. A diferencia del de desarrollo, este NO construye la
# imagen: la baja ya construida del registro de GitHub. El VPS tiene poca RAM y
# compilar pandas y scikit-learn ahi puede tumbar los otros servicios.
#
# La variable IMAGEN la pone el script desplegar_remoto.sh.
services:
  api:
    image: ${IMAGEN}
    container_name: startup-survival-api
    restart: unless-stopped
    ports:
      # Solo escucha en 127.0.0.1. El proxy del servidor es el unico que le
      # habla, y es quien se encarga del dominio y del HTTPS.
      - "127.0.0.1:8000:8000"
    mem_limit: 700m
    environment:
      # Protege la vista de administracion donde se marcan los desenlaces.
      # En produccion se define de verdad; vacio deja la vista abierta.
      TOKEN_ADMIN: ${TOKEN_ADMIN:-}
    volumes:
      # Las consultas de los usuarios viven en este volumen. Sin el, cada
      # redespliegue borraria todo lo que la gente respondio.
      - consultas:/app/consultas

volumes:
  consultas:
