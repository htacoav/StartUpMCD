[pytest]
# Sin esto, "pytest" a secas no encuentra los paquetes app y ml: pytest solo
# agrega al path la carpeta de las pruebas, no la raiz del proyecto. Funcionaba
# al correrlo como "python -m pytest", que si agrega la carpeta actual, y por
# eso la falla aparecio recien en GitHub Actions.
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
